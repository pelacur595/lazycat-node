name: Build and Release

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "scripts/**"
      - "config.example.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Linux tests with race detector
        run: go test -race -timeout 10m ./...
      - name: Check shell syntax
        run: bash -n scripts/install.sh && bash -n scripts/ppnode.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            asset: "64"
          - arch: arm64
            asset: arm64-v8a
    env:
      GOOS: linux
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build native binary and package
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          version="sync-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:8}"
          mkdir -p build_assets
          go build -trimpath -ldflags "-X github.com/perfect-panel/ppanel-node/cmd.version=$version -s -w -buildid=" -o build_assets/ppnode .
          cp README.md LICENSE CREDENTIAL-SYNC.md build_assets/
          cp config.example.yml build_assets/config.yml
          cp scripts/ppnode.sh build_assets/
          for name in geoip geosite; do
            curl -fL --retry 3 "https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/$name.dat" -o "build_assets/$name.dat"
          done
          (cd build_assets && zip -9 "../ppanel-node-linux-$ASSET.zip" *)
          sha256sum "ppanel-node-linux-$ASSET.zip" > "ppanel-node-linux-$ASSET.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.asset }}
          path: |
            ppanel-node-linux-*.zip
            ppanel-node-linux-*.zip.sha256
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          sha256sum -c ./*.sha256
          tag="sync-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:8}"
          gh release create "$tag" ./*.zip ./*.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "LazyCat Node $tag" --notes "Linux amd64/arm64. Credential synchronization fork; retains upstream core versions. Preserve /etc/PPanel-node/config.yml. Requires matching backend for immediate synchronization."
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
